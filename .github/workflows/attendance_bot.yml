name: 勤怠お知らせBot（個人認証版）

on:
  schedule:
    # 毎日10:00に実行（JST）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  attendance-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib pandas python-dotenv requests
    
    - name: Check environment variables
      run: |
        echo "=== 環境変数チェック ==="
        echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
        echo "CI: $CI"
        echo "SPREADSHEET_ID: ${SPREADSHEET_ID:0:10}..."
        echo "SHEET_NAME: $SHEET_NAME"
        echo "DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:0:30}..."
        echo "GOOGLE_OAUTH_CLIENT_CONFIG: ${GOOGLE_OAUTH_CLIENT_CONFIG:0:20}..."
        echo "GOOGLE_OAUTH_TOKEN: ${GOOGLE_OAUTH_TOKEN:0:20}..."
        echo "=========================="
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        SHEET_NAME: ${{ secrets.SHEET_NAME }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_OAUTH_CLIENT_CONFIG: ${{ secrets.GOOGLE_OAUTH_CLIENT_CONFIG }}
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}

    - name: Run attendance bot (OAuth)
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        SHEET_NAME: ${{ secrets.SHEET_NAME }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_OAUTH_CLIENT_CONFIG: ${{ secrets.GOOGLE_OAUTH_CLIENT_CONFIG }}
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
      run: |
        python attendance_bot_clean.py
