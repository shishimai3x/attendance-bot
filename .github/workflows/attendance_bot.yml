name: 勤怠お知らせBot（個人認証版）

on:
  schedule:
    # 毎日 JST 8:00 に実行 (UTC 23:00 前日)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  attendance-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check environment variables
      run: |
        echo "=== 環境変数チェック ==="
        echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
        echo "CI: $CI"
        echo "SPREADSHEET_ID: ${SPREADSHEET_ID:0:10}..."
        echo "DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:0:30}..."
        echo "GOOGLE_OAUTH_CLIENT_CONFIG: ${GOOGLE_OAUTH_CLIENT_CONFIG:0:20}..."
        echo "GOOGLE_OAUTH_TOKEN: ${GOOGLE_OAUTH_TOKEN:0:20}..."
        echo "=========================="
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_OAUTH_CLIENT_CONFIG: ${{ secrets.GOOGLE_OAUTH_CLIENT_CONFIG }}
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}

    - name: Run attendance bot (OAuth)
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_OAUTH_CLIENT_CONFIG: ${{ secrets.GOOGLE_OAUTH_CLIENT_CONFIG }}
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        TZ: Asia/Tokyo
      run: |
        echo "実行時刻: $(date)"
        echo "JST時刻: $(TZ=Asia/Tokyo date)"
        python attendance_bot_clean.py
