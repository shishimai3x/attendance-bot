name: 勤怠お知らせBot（個人認証版）

on:
  schedule:
    # 毎日 JST 8:00 相当（GitHub Actions の cron は UTC 解釈）
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-bot
  cancel-in-progress: false

jobs:
  attendance-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GOOGLE_OAUTH_CLIENT_CONFIG: ${{ secrets.GOOGLE_OAUTH_CLIENT_CONFIG }}
      GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare requirements.txt (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f requirements.txt ]; then
            cat > requirements.txt <<'EOF'
google-api-python-client
google-auth-httplib2
google-auth-oauthlib
pandas
python-dotenv
requests
EOF
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment variables (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 実行環境 ==="
          echo "UTC: $(date -u)"
          echo "JST: $(TZ=Asia/Tokyo date)"
          for k in SPREADSHEET_ID DISCORD_WEBHOOK_URL GOOGLE_OAUTH_CLIENT_CONFIG GOOGLE_OAUTH_TOKEN; do
            v="${!k:-}"
            if [ -n "$v" ]; then
              echo "$k: SET (len=${#v})"
            else
              echo "$k: MISSING"
              exit 1
            fi
          done
          echo "==============="

      - name: Run attendance bot (OAuth)
        shell: bash
        run: |
          set -euo pipefail
          python -u attendance_bot_clean.py

